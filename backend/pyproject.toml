[project]
name = "news-caught-backend"
version = "0.1.0"
description = "Backend service for the personal HK/US market news tracker."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0",
  "beautifulsoup4>=4.12.0",
  "cryptography>=48.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.6.0",
  "redis>=6.4.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  # E501 (line-too-long): the project has no code-formatter pass wired in (no
  # `ruff format` / black step), and a lot of existing lines (long test
  # assertions, SQL-ish strings, URLs) intentionally exceed 100 columns.
  # Enforcing it here would force a large, purely cosmetic reformat across
  # dozens of files with zero correctness benefit; `line-length = 100` is kept
  # for tooling/editor guidance. Revisit if/when a formatter is adopted.
  "E501",
  # B008 (function-call-in-default-argument): this is FastAPI's documented
  # dependency-injection idiom (`Depends(...)`, and similarly `Query`/`Body`/
  # `Header`/`Cookie`/`Path`/`Security`) used throughout app/api/routes/*.py.
  # It is correct and intentional, not a bug — flagging it would be pure noise.
  "B008",
]

[tool.ruff.lint.per-file-ignores]
# Facade package re-exports private helpers (`_normalize_*`, `_record_fetch_*`, ...) so
# that existing callers/tests can keep doing `from app.services.x_monitor import <name>`.
# They're intentionally not all listed in `__all__` (only the public surface is), so ruff
# can't see the cross-module usage. See the module docstring for details.
"app/services/x_monitor/__init__.py" = ["F401"]
# Alembic autogenerate needs every model imported here purely for its side effect of
# registering the table with Base.metadata; the names themselves are never referenced.
"alembic/env.py" = ["F401"]
# Same backward-compatible re-export facade pattern as x_monitor/__init__.py above: the
# ingestion package was split into app/services/ingestion/*, and this module re-exports
# both the public API (listed in `__all__`) and private helpers/parsers that other
# modules (e.g. google_news_search.py) and tests still import directly from here.
"app/services/news_ingestion.py" = ["F401"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
